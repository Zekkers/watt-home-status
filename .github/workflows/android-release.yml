name: Android release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests
        working-directory: android
        run: ./gradlew test --stacktrace

      - name: Require family signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${KEYSTORE_BASE64}" ] && missing+=("KEYSTORE_BASE64")
          [ -z "${KEYSTORE_PASSWORD}" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "${KEY_ALIAS}" ] && missing+=("KEY_ALIAS")
          [ -z "${KEY_PASSWORD}" ] && missing+=("KEY_PASSWORD")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Family signing secrets are missing: ${missing[*]}. Add them under Settings → Secrets and variables → Actions. The first run is expected to fail until those exist. Refusing to ship an unsigned or debug-signed APK as a family build."
            exit 1
          fi

      - name: Decode family keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/watt-signing"
          keystore_path="${RUNNER_TEMP}/watt-signing/watt-family.jks"
          if ! printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if [ ! -s "${keystore_path}" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          chmod 600 "${keystore_path}"
          echo "KEYSTORE_FILE=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Assemble release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watt-home-status.apk
          path: android/app/release/watt-home-status.apk
          if-no-files-found: error

      # Rolling `latest` tag so /releases/latest and
      # /releases/latest/download/watt-home-status.apk stay stable without a
      # human cutting a version tag. GITHUB_TOKEN tag pushes do not re-run
      # this workflow; `latest` also does not match tags: ["v*"].
      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="android/app/release/watt-home-status.apk"
          if [ ! -f "${apk}" ]; then
            echo "::error::Missing ${apk}"
            exit 1
          fi

          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force

          notes="Household sideload APK from ${GITHUB_SHA}. This rolling release is updated on every successful main or manual build."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "${apk}" --clobber
            gh release edit latest --title "Latest" --notes "${notes}" --latest
          else
            gh release create latest "${apk}" \
              --title "Latest" \
              --notes "${notes}" \
              --latest \
              --verify-tag
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "${tag}" >/dev/null 2>&1; then
              gh release upload "${tag}" "${apk}" --clobber
            else
              gh release create "${tag}" "${apk}" \
                --title "${tag}" \
                --generate-notes \
                --verify-tag \
                --latest=false
            fi
            # Keep /releases/latest pointing at the rolling tag, not v*.
            gh release edit latest --latest
          fi
